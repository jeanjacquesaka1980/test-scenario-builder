<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Scenario Builder</title>
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>

  <header class="app-header">
    <h1>Test Scenario Builder</h1>
    <button type="button" id="clear-all-btn" class="btn btn-clear-all">Clear all</button>
  </header>

  <main class="app-main">

    <!-- Scenario name -->
    <section class="scenario-name-section">
      <label for="scenario-name">Scenario name</label>
      <input type="text" id="scenario-name" placeholder="e.g. Login with valid credentials">

      <label for="scenario-description">Description</label>
      <textarea id="scenario-description" rows="2" placeholder="What this scenario covers"></textarea>
    </section>

    <!-- Enforces Act + Assert only (Arrange is left to the agent that reads
         this JSON). "+ Test" and "+ Tests" are the only entry points —
         each instantiates a scaffold (Action + Assertion, or a shared
         beforeEach + two tests). A test's own Action side and the shared
         Before Each section are both fully removable (some tests act via
         a fixture and go straight to the assertion; some describes don't
         need a shared beforeEach at all) — everything else can only grow.
         The first thing either scaffold creates is the fixed "Login and
         Navigation" block (see login-nav-template) — it's metadata for
         the agent, not part of the describe/test code, so it lives
         outside "describe" in the export. -->
    <section class="steps-section">
      <div id="shared-steps-list" class="steps-list"></div>
      <div class="list-controls">
        <button type="button" id="mode-test-btn" class="btn btn-add-test">+ Test</button>
        <button type="button" id="mode-tests-btn" class="btn btn-add-test">+ Tests</button>
        <button type="button" id="grow-test-btn" class="btn btn-add-test" hidden>+ Add test</button>
      </div>
    </section>

    <!-- Export. Not strict JSON — see script.js EXPORT section for why —
         so there's no "Download JSON" file, just copy the text. -->
    <section class="export-section">
      <h2>Export</h2>
      <div class="export-buttons">
        <button type="button" id="copy-json-btn" class="btn">Copy to clipboard</button>
        <span id="copy-feedback" class="copy-feedback" aria-live="polite"></span>
      </div>
      <pre id="json-preview" class="json-preview"></pre>
    </section>

  </main>

  <!-- Confirmation dialog for "Clear all". A native <dialog> instead of
       window.confirm() so it renders reliably in every embedding context. -->
  <dialog id="clear-confirm-dialog" class="confirm-dialog">
    <p>Clear the scenario name and everything below? This cannot be undone.</p>
    <div class="confirm-dialog-buttons">
      <button type="button" id="clear-cancel-btn" class="btn">Cancel</button>
      <button type="button" id="clear-confirm-btn" class="btn btn-danger">Clear everything</button>
    </div>
  </dialog>

  <!-- Confirmation dialog for switching between "Test" mode and "Tests"
       mode — they can't coexist, so switching clears whatever exists. -->
  <dialog id="mode-switch-confirm-dialog" class="confirm-dialog">
    <p id="mode-switch-message"></p>
    <div class="confirm-dialog-buttons">
      <button type="button" id="mode-switch-cancel-btn" class="btn">Cancel</button>
      <button type="button" id="mode-switch-confirm-btn" class="btn btn-danger">Switch</button>
    </div>
  </dialog>

  <!-- Row template, cloned by JS for each leaf action/assertion -->
  <template id="step-row-template">
    <div class="step-row" data-step-id="">
      <div class="step-row-main">
        <span class="step-number"></span>

        <select class="field field-action" data-field="action"></select>

        <input type="text" class="field field-target" data-field="target" placeholder="target (e.g. #submit-button)">

        <select class="field field-selection" data-field="selection">
          <option value="single">single</option>
          <option value="multi">multi</option>
        </select>

        <input type="text" class="field field-value" data-field="value" placeholder="value">

        <div class="step-row-controls">
          <button type="button" class="btn btn-icon btn-move-up" title="Move up">&uarr;</button>
          <button type="button" class="btn btn-icon btn-move-down" title="Move down">&darr;</button>
          <button type="button" class="btn btn-icon btn-remove" title="Remove step">&times;</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Login and Navigation: fixed, always the first thing created by
       either scaffold, never removable. Pure metadata for the agent (who
       to log in as, what to pick, where to navigate) — not Playwright
       code, so it's not part of "describe" in the export. -->
  <template id="login-nav-template">
    <div class="login-nav-block">
      <div class="login-nav-header">
        <span class="login-nav-badge">Login and Navigation</span>
      </div>
      <div class="login-subblock">
        <span class="login-subblock-label">Login</span>
        <label class="login-field">
          User type
          <input type="text" class="login-user-type" placeholder="e.g. admin">
        </label>
        <label class="login-field">
          Unit
          <input type="text" class="login-unit" placeholder="unit to select">
        </label>
      </div>
      <label class="login-field navigation-flow-field">
        Navigation flow
        <input type="text" class="navigation-flow-input" placeholder="e.g. Dashboard > Settings > Billing">
      </label>
    </div>
  </template>

  <!-- Before Each: ONE shared section (labeled once) that runs before
       every test, holding one-or-more plain Action blocks (the first
       fixed, any extra ones removable) — not multiple "Before Each"
       blocks. Its own "+ Action" always appends a new Action block at the
       end; there's no Assertion side since beforeEach never holds
       assertions. The whole section is optional — not every Tests
       scaffold needs one — so its header carries its own remove button
       that deletes the entire section in one go. -->
  <template id="before-each-container-template">
    <div class="before-each-container">
      <div class="before-each-header">
        <span class="before-each-badge">Before Each</span>
        <button type="button" class="btn btn-icon btn-remove-before-each" title="Remove Before Each">&times;</button>
      </div>
      <div class="before-each-list steps-list"></div>
      <div class="list-controls">
        <button type="button" class="btn btn-add-action-block">+ Action</button>
      </div>
    </div>
  </template>

  <!-- Test block template: a labeled envelope that owns zero-or-more
       Action groups followed by one-or-more Assertion groups (the
       starting Action group is removable — some tests act via a fixture
       and go straight to the assertion — but the starting Assertion
       group is fixed: Assert is the one thing every test keeps), and its
       own title. Its own remove (×) button is present in the markup but
       hidden by JS for the fixed test instances (the first two inside a
       Tests scaffold, since those can't be removed). "+ Action" always
       inserts right before the first Assertion group; "+ Assertion"
       always appends at the very end — so actions stay before assertions
       no matter how many of each exist. -->
  <template id="test-block-template">
    <div class="test-block" data-test-id="">
      <div class="test-block-header">
        <span class="test-block-badge">Test</span>
        <input type="text" class="test-title-input" data-field="test-title" placeholder="Title (optional)">
        <button type="button" class="btn-note-toggle" title="Add a note">note</button>
        <button type="button" class="btn btn-icon btn-remove-test" title="Remove test">&times;</button>
      </div>
      <textarea class="test-note-input" rows="2" placeholder="Note for the agent" hidden></textarea>
      <div class="test-steps-list steps-list"></div>
      <div class="list-controls">
        <button type="button" class="btn btn-add-action-block">+ Action</button>
        <button type="button" class="btn btn-add-assertion-block">+ Assertion</button>
      </div>
    </div>
  </template>

  <!-- Action block template: a leaf envelope that can only hold plain
       interaction actions (no assertions, no nested test). Same structure
       as the assertion block template below — themed differently via the
       .action-block modifier class — so both are built by one JS function.
       Also reused as-is for each Action block inside the shared Before
       Each section (see before-each-container-template above). The small
       "note" toggle reveals an optional note textarea below the header —
       deliberately a plain text link, not a boxed button, since most
       blocks won't need one. -->
  <template id="action-block-template">
    <div class="block action-block" data-block-id="">
      <div class="block-header">
        <span class="block-badge">Action</span>
        <span class="block-number"></span>
        <input type="text" class="block-title-input" data-field="block-title" placeholder="Title (optional)">
        <button type="button" class="btn-note-toggle" title="Add a note">note</button>
        <div class="block-controls">
          <button type="button" class="btn btn-icon btn-move-up" title="Move up">&uarr;</button>
          <button type="button" class="btn btn-icon btn-move-down" title="Move down">&darr;</button>
          <button type="button" class="btn btn-icon btn-remove-block" title="Remove action">&times;</button>
        </div>
      </div>
      <textarea class="block-note-input" rows="2" placeholder="Note for the agent" hidden></textarea>
      <div class="block-steps-list steps-list"></div>
      <button type="button" class="btn btn-add-item">+ Add action</button>
    </div>
  </template>

  <!-- Assertion block template: a leaf envelope that can only hold
       assertions (no plain action, no nested test). -->
  <template id="assertion-block-template">
    <div class="block assertion-block" data-block-id="">
      <div class="block-header">
        <span class="block-badge">Assertion</span>
        <span class="block-number"></span>
        <input type="text" class="block-title-input" data-field="block-title" placeholder="Title (optional)">
        <button type="button" class="btn-note-toggle" title="Add a note">note</button>
        <div class="block-controls">
          <button type="button" class="btn btn-icon btn-move-up" title="Move up">&uarr;</button>
          <button type="button" class="btn btn-icon btn-move-down" title="Move down">&darr;</button>
          <button type="button" class="btn btn-icon btn-remove-block" title="Remove assertion">&times;</button>
        </div>
      </div>
      <textarea class="block-note-input" rows="2" placeholder="Note for the agent" hidden></textarea>
      <div class="block-steps-list steps-list"></div>
      <button type="button" class="btn btn-add-item">+ Add assertion</button>
    </div>
  </template>

  <!-- Cache-busting query param: bump this whenever script.js changes, so
       browsers don't keep serving a stale cached copy during development. -->
  <script src="script.js?v=29"></script>
</body>
</html>
